    <text x="640" y="272" font-size="19" letter-spacing="8.5" fill="#6d5730">DIE CHRONIKEN VON AZEROTH</text>
  </g>

  <rect x="392" y="298" width="496" height="1.5" fill="url(#ruleDark)"/>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6d5730" font-style="italic">
    <text x="640" y="334">Ein inkrementelles Fantasy-RPG &#183; Ein Held &#183; Drei Zonen</text>
  </g>

  <rect width="1280" height="420" fill="url(#vigLight)"/>
  <rect x="0" y="0" width="1280" height="420" fill="none" stroke="#8a6c3c" stroke-opacity="0.45" stroke-width="2"/>
