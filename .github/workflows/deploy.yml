name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Schreibrechte nur für dieses Deployment, alles andere bleibt beim Standard.
permissions:
  contents: read
  pages: write
  id-token: write

# Ein neuer Push ersetzt eine laufende Veröffentlichung.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installieren
        run: npm ci

      # typecheck läuft mit: Es soll nicht deployt werden, was nicht übersetzt.
      - name: Prüfen
        run: |
          npm run typecheck
          npm run smoke

      - name: Bauen
        run: npm run build

      - name: Prüfen des Builds
        run: |
          test -f dist/index.html
          echo "Inhalt von dist:" && ls -1 dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
